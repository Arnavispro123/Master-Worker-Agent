<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>JARVIS orb</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;
    font:12px/1.45 "Segoe UI",system-ui,sans-serif;color:#dcefff;-webkit-user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:10px;cursor:pointer}
  #orbwrap{position:relative;width:190px;height:190px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #beat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
  .ring{position:absolute;inset:4px;border-radius:50%;pointer-events:none;
    border:1px solid rgba(56,225,255,.55);animation:ripple 2.8s ease-out infinite}
  .ring.r2{animation-delay:1.4s}
  @keyframes ripple{from{transform:scale(.82);opacity:.9}to{transform:scale(1.18);opacity:0}}
  body[data-s="speaking"] .ring{animation-duration:1.1s;border-color:rgba(216,251,255,.8)}
  body[data-s="listening"] .ring{animation-duration:1.6s}
  #orb{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0;
    transform-origin:center;will-change:transform;
    background:radial-gradient(circle at 35% 32%,rgba(216,251,255,.95),rgba(56,225,255,.85) 42%,rgba(11,58,82,.92) 78%);
    box-shadow:0 0 34px rgba(56,225,255,.45),inset 0 0 22px rgba(255,255,255,.28);
    border:1px solid rgba(216,251,255,.5);transition:box-shadow .3s}
  #orb::after{content:"";position:absolute;inset:14px;border-radius:50%;
    border:1px solid rgba(216,251,255,.35)}
  body[data-s="listening"] #orb{animation:pulse .9s infinite}
  body[data-s="speaking"] #orb{animation:pulse 1.6s infinite}
  body[data-s="working"] #orb{box-shadow:0 0 52px rgba(139,123,255,.75),inset 0 0 22px rgba(255,255,255,.3)}
  @keyframes pulse{50%{box-shadow:0 0 64px rgba(56,225,255,.85),inset 0 0 22px rgba(255,255,255,.4)}}
  #panel{width:100%;background:rgba(6,12,24,.72);border:1px solid rgba(56,225,255,.22);
    border-radius:14px;padding:8px 11px;backdrop-filter:blur(6px);text-align:center}
  #state{font-weight:700;letter-spacing:1px;font-size:11px;color:#38e1ff;text-transform:uppercase}
  #dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;box-shadow:0 0 7px #4ade80}
  #dot.off{background:#ff6b6b;box-shadow:0 0 7px #ff6b6b}
  #last{color:#b9d9ec;font-size:11.5px;margin-top:3px;min-height:16px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #feed{font-size:10.5px;color:#54708a;margin-top:2px;min-height:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
</style>
</head>
<body data-s="idle">
  <div id="orbwrap"><div class="ring"></div><div class="ring r2"></div><canvas id="beat" width="260" height="260"></canvas><div id="orb"></div></div>
  <div id="panel">
    <div><span id="dot"></span><span id="state">standby</span></div>
    <div id="last">click me to open Jarvis</div>
    <div id="feed"></div>
  </div>
<script>
const API = (window.jarvisAPI && window.jarvisAPI.base) || "http://127.0.0.1:8765";
const seen = new Set();
let hideT = null;
/* voice-reactive radius + circular beats visualizer.
   Live amplitude (~12Hz from the HUD analyser) feeds a rolling envelope;
   72 bars dance around the orb — syllables literally draw themselves. */
const orbEl = document.getElementById("orb");
const beat = document.getElementById("beat").getContext("2d");
const NBAR = 72, hist = new Array(NBAR).fill(0);
let targetAmp = 0, lastLevelAt = 0, curScale = 1, hHead = 0;
function loop(t) {
  const stale = Date.now() - lastLevelAt > 260;
  const st = document.body.dataset.s;
  let want = 1;
  if (!stale) want = 1 + Math.min(0.35, targetAmp * 1.4);       // live voice
  else if (st === "speaking") want = 1 + 0.06 * (0.5 + 0.5 * Math.sin(t / 130)); // fallback wobble
  else if (st === "listening") want = 1 + 0.03 * Math.sin(t / 400);
  curScale += (want - curScale) * 0.35;
  orbEl.style.transform = "scale(" + curScale.toFixed(3) + ")";
  // beats ring: fresh level at the head, everything decays toward idle ripple
  const live = stale ? 0 : Math.min(1, targetAmp * 1.6);
  hist[hHead] = Math.max(hist[hHead] * 0.82, live);
  hHead = (hHead + 1) % NBAR;
  beat.clearRect(0, 0, 260, 260);
  beat.lineCap = "round";
  for (let i = 0; i < NBAR; i++) {
    const v = hist[(hHead + i) % NBAR] * 0.9 +
      0.05 + 0.03 * Math.sin(t / 500 + i * 0.55);
    const a = (i / NBAR) * Math.PI * 2 - Math.PI / 2;
    const r0 = 84, r1 = r0 + Math.max(2, v * 52);
    beat.strokeStyle = st === "working"
      ? `rgba(139,123,255,${0.25 + v * 0.65})`
      : `rgba(56,225,255,${0.22 + v * 0.7})`;
    beat.lineWidth = 3;
    beat.beginPath();
    beat.moveTo(130 + Math.cos(a) * r0, 130 + Math.sin(a) * r0);
    beat.lineTo(130 + Math.cos(a) * r1, 130 + Math.sin(a) * r1);
    beat.stroke();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function show(state, text) {
  document.body.dataset.s = state;
  document.getElementById("state").textContent = state;
  if (text) {
    document.getElementById("last").textContent = text;
    const f = document.getElementById("feed");
    f.textContent = text.slice(0, 90);
  }
  clearTimeout(hideT);
  if (state !== "listening") hideT = setTimeout(() => {
    document.body.dataset.s = "idle";
    document.getElementById("state").textContent = "standby";
  }, 9000);
}
// HUD events forwarded by main process
try {
  window.jarvisAPI && window.jarvisAPI.onOrb && window.jarvisAPI.onOrb(d => {
    if (!d) return;
    if (d.activity === "level") { targetAmp = Math.max(0, Math.min(1, +d.level || 0)); lastLevelAt = Date.now(); return; }
    targetAmp = 0;
    show(d.activity || "idle", d.text);
  });
} catch {}
// backend activity bus: reacts no matter which window acted (browser, HUD, headless)
let actCursor = 0;
setInterval(async () => {
  try {
    const p = await (await fetch(API + "/api/activity/poll?since=" + actCursor)).json();
    for (const h of (p.events || [])) {
      actCursor = Math.max(actCursor, h.id || 0);
      if (!h.kind || h.kind === "idle") { show("idle"); continue; }
      show(h.kind === "thinking" ? "working" : h.kind, h.text);
    }
  } catch {}
}, 1000);
// display-only peek: never drains the queue (the HUD chat owns delivery)
setInterval(async () => {
  try {
    const p = await (await fetch(API + "/api/wake/poll?peek=1")).json();
    for (const h of (p.hits || [])) {
      if (h.kind !== "command" || !h.text) continue;
      const k = h.n + "::" + h.text;
      if (seen.has(k)) continue;
      seen.add(k);
      show("heard", h.text);
    }
  } catch {}
}, 1500);
setInterval(async () => {
  try {
    const r = await (await fetch(API + "/api/health")).json();
    document.getElementById("dot").classList.toggle("off", !r.ok);
  } catch {
    document.getElementById("dot").classList.add("off");
  }
}, 5000);
/* drag anywhere to rest it where you like (click = open Jarvis) */
(function () {
  let down = false, sx = 0, sy = 0, moved = false;
  const api = () => (window.jarvisAPI || {});
  document.body.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    down = true; moved = false; sx = e.screenX; sy = e.screenY;
  });
  window.addEventListener("mousemove", e => {
    if (!down) return;
    const dx = e.screenX - sx, dy = e.screenY - sy;
    if (Math.abs(e.screenX - sx) + Math.abs(e.screenY - sy) > 4) moved = true;
    if (moved) {
      try { api().orbDrag && api().orbDrag(dx, dy); } catch {}
      sx = e.screenX; sy = e.screenY;
    }
  });
  window.addEventListener("mouseup", () => {
    if (!down) return;
    down = false;
    if (moved) { try { api().orbDragEnd && api().orbDragEnd(); } catch {} }
    else { try { api().orbClick && api().orbClick(); } catch {} }
  });
})();
</script>
</body>
</html>
